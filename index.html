<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>SkillSeek – AI skill search</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f7f6f3;--card:#fff;--tx:#1d1d1f;--mu:#6b6b72;--ac:#4f46e5;--ac2:#eef0ff;--bd:#e3e1db;--ok:#15803d;--wn:#b45309}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15151a;--card:#1f1f26;--tx:#f1f1f3;--mu:#9a9aa5;--ac:#818cf8;--ac2:#25263f;--bd:#33333d;--ok:#4ade80;--wn:#fbbf24}}
:root[data-theme="dark"]{--bg:#15151a;--card:#1f1f26;--tx:#f1f1f3;--mu:#9a9aa5;--ac:#818cf8;--ac2:#25263f;--bd:#33333d;--ok:#4ade80;--wn:#fbbf24}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
nav{display:flex;gap:4px;overflow-x:auto;padding:10px 14px;border-bottom:1px solid var(--bd);background:var(--card);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
nav b{margin-right:10px;color:var(--ac);white-space:nowrap;align-self:center}
nav button{border:0;background:none;color:var(--mu);padding:6px 10px;border-radius:8px;cursor:pointer;white-space:nowrap;font:inherit}
nav button.on{background:var(--ac2);color:var(--ac);font-weight:600}
main{max-width:980px;margin:0 auto;padding:18px 14px 60px}
h1{font-size:clamp(28px,6vw,44px);line-height:1.1;margin:30px 0 8px}h2{margin:18px 0 8px}h3{margin:0}
.mu{color:var(--mu)}.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin:10px 0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.sp{justify-content:space-between}
input,select,textarea{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:10px;width:100%}
.btn{border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:9px 14px;border-radius:10px;cursor:pointer;font:inherit}
.btn.p{background:var(--ac);color:#fff;border-color:var(--ac)}.btn:focus-visible,input:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.chip{display:inline-block;background:var(--ac2);color:var(--ac);border-radius:99px;padding:2px 10px;font-size:13px;margin:2px 4px 2px 0}
.chip.g{background:none;border:1px solid var(--bd);color:var(--mu)}.ok{color:var(--ok)}.wn{color:var(--wn)}
.av{width:44px;height:44px;border-radius:50%;background:var(--ac);color:#fff;display:grid;place-items:center;font-weight:700;flex:none}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.scroll{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:520px}td,th{border-bottom:1px solid var(--bd);padding:8px;text-align:left;vertical-align:top;font-size:14px}
.msg{padding:8px 12px;border-radius:12px;margin:6px 0;max-width:80%;background:var(--ac2)}.msg.me{margin-left:auto;background:var(--ac);color:#fff}
.bar{height:8px;background:var(--bd);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
.modal{position:fixed;inset:0;background:#0008;display:grid;place-items:center;padding:14px;z-index:9}.modal>div{background:var(--card);border-radius:16px;padding:18px;max-width:480px;width:100%;max-height:90%;overflow:auto}
pre{background:var(--bg);padding:12px;border-radius:10px;overflow-x:auto;font-size:13px}
</style></head><body>
<nav id="nav"><b>◆ SkillSeek</b></nav><main id="app"></main><div id="mod"></div>
<script>
const P=[
{id:1,n:'Rahul Verma',h:'Java & Spring Boot Developer, mentor',sk:['java','spring','rest','backend','mysql'],ex:3,r:4.8,rv:46,done:58,rate:600,av:'Sat–Sun, 10 AM–6 PM',wk:1,mode:['online'],loc:'Pune',v:['email','phone','id','skill'],teach:1,loc2:'Online',prev:'Mentored 14 college projects on Spring Boot REST APIs',resp:96},
{id:2,n:'Alex Sharma',h:'Python Developer & Mentor',sk:['python','django','data','backend'],ex:5,r:4.8,rv:120,done:120,rate:500,av:'Today 6–9 PM',wk:0,mode:['online','offline'],loc:'Nashik',v:['email','phone','id'],teach:1,prev:'Taught Python to 90+ beginners',resp:98},
{id:3,n:'Priya Nair',h:'UI/UX & Web Designer',sk:['design','figma','ui','ux','frontend'],ex:4,r:4.9,rv:72,done:81,rate:900,av:'Weekdays 5–9 PM',wk:0,mode:['online'],loc:'Bengaluru',v:['email','phone','id','portfolio'],teach:1,prev:'Redesigned 12 SaaS landing pages',resp:91},
{id:4,n:'Karan Mehta',h:'React Engineer · debugging help',sk:['react','javascript','frontend','node'],ex:6,r:4.7,rv:38,done:44,rate:1100,av:'Tomorrow 7–10 PM',wk:0,mode:['online'],loc:'Mumbai',v:['email','phone','skill'],teach:0,prev:'Debugged 30+ React projects',resp:88},
{id:5,n:'Sneha Kulkarni',h:'Excel & Dashboard Specialist',sk:['excel','dashboard','data','powerbi'],ex:7,r:4.9,rv:64,done:90,rate:700,av:'Sat 11 AM–4 PM',wk:1,mode:['online'],loc:'Nashik',v:['email','phone','id','skill'],teach:1,prev:'Built 40 finance dashboards',resp:95},
{id:6,n:'Imran Shaikh',h:'Photographer & Video Editor',sk:['photo','video','premiere','motion'],ex:5,r:4.6,rv:51,done:67,rate:800,av:'Weekends',wk:1,mode:['offline','online'],loc:'Nashik',v:['email','phone','portfolio'],teach:0,prev:'200+ events, 60 short videos',resp:84},
{id:7,n:'Meera Joshi',h:'Public Speaking & Language Coach',sk:['speaking','english','coaching'],ex:8,r:5,rv:29,done:33,rate:650,av:'Mon–Fri 7–9 PM',wk:0,mode:['online','offline'],loc:'Pune',v:['email','phone'],teach:1,prev:'Coached 25 TEDx-style talks',resp:99}];
const D={java:['java'],spring:['spring boot','spring'],rest:['rest','api'],python:['python'],react:['react'],excel:['excel','dashboard','spreadsheet'],video:['video','edit'],photo:['photograph','photo'],design:['designer','design','ui','figma','logo'],speaking:['public speaking','speech','presentation']};
const REL={spring:['java','backend','rest'],java:['backend','spring'],rest:['backend','spring','node'],python:['django','data','backend'],react:['javascript','frontend','node'],excel:['data','dashboard','powerbi'],video:['premiere','motion'],photo:['video'],design:['figma','ui','ux','frontend'],speaking:['english','coaching']};
const $=s=>document.querySelector(s),app=$('#app');let Q=null,sel=[],cur=null,flow=0,msgs=[],tab='home';
const T={home:'Home',prof:'Create Profile',dash:'Dashboard',chat:'Messages',admin:'Admin'};
function nav(){$('#nav').innerHTML='<b>◆ SkillSeek</b>'+Object.keys(T).map(k=>`<button class="${k==tab?'on':''}" onclick="go('${k}')">${T[k]}</button>`).join('')}
function go(t){tab=t;nav();window.scrollTo(0,0);({home,prof,dash,chat,admin})[t]()}
function parse(t){const l=t.toLowerCase(),s=[];for(const k in D)if(D[k].some(w=>l.includes(w))&&!s.includes(k))s.push(k);
if(l.includes('spring')&&!s.includes('java'))s.unshift('java');
const learn=/teach|learn|understand|mentor|tutor|coach/.test(l),d=l.match(/(\d+)\s*(hour|hr|day|weekend)/),b=l.match(/(?:₹|rs\.?\s?|under\s)(\d+)/);
return{s,intent:learn?'Learning / mentoring':'Short-term task',dur:d?d[1]+' '+d[2]+(d[1]>1?'s':''):'Not specified',mode:/in person|offline|nearby|local/.test(l)?'offline':'online',bud:b?+b[1]:null,wk:/weekend|saturday|sunday/.test(l),learn,raw:t}}
function score(p,q){let rel=0;q.s.forEach(k=>{rel+=p.sk.includes(k)?1:(REL[k]||[]).some(x=>p.sk.includes(x))?.55:0});rel=q.s.length?rel/q.s.length:0;
const R=[],ex=Math.min(p.ex/5,1),pr=q.bud?(p.rate<=q.bud?1:.4):.8,av=q.wk?(p.wk?1:.3):.7,vf=p.v.length/5,md=p.mode.includes(q.mode)?1:.4,rt=(p.r-3)/2;
if(rel>=.9)R.push('Direct skill match: '+q.s.filter(k=>p.sk.includes(k)).join(', '));else if(rel>0)R.push('Related skills found semantically: '+p.sk.filter(x=>q.s.some(k=>(REL[k]||[]).includes(x))).join(', '));
if(q.learn&&p.teach)R.push('Offers teaching & mentoring');if(p.ex>=3)R.push(p.ex+' years experience');if(q.wk&&p.wk)R.push('Available weekends');
if(p.mode.includes(q.mode))R.push(q.mode=='online'?'Offers online sessions':'Offers in-person help');if(q.bud&&p.rate<=q.bud)R.push('Within your ₹'+q.bud+'/hr budget');R.push('Previous work: '+p.prev);
return{p,rel,why:R,m:Math.round(100*(.4*rel+.12*ex+.1*pr+.1*av+.1*rt+.08*vf+.05*md+.05*p.resp/100))}}
const star=r=>'★'.repeat(Math.round(r))+'☆'.repeat(5-Math.round(r));
const VL={email:'Email',phone:'Phone',id:'ID',skill:'Skill',portfolio:'Portfolio'};
function home(){app.innerHTML=`<h1>Find the right person for any skill.</h1><p class="mu">Search, learn, collaborate or hire — powered by AI.<br><b>Tell us what you need. Our AI finds the right person with the right skill, at the right time.</b></p>
<div class="card"><label for="q" class="mu">What skill or help are you looking for?</label><textarea id="q" rows="2" placeholder="Ask in your own words…">${Q?Q.raw:'I want someone to teach me Spring Boot and REST APIs for my college project.'}</textarea>
<div class="row" style="margin-top:10px"><button class="btn p" onclick="search($('#q').value)">Find a Skill</button><button class="btn" onclick="go('prof')">Offer Your Skills</button></div>
<p class="mu" style="margin:10px 0 4px">Try:</p>${['I need someone to teach me Python for 5 hours','Need a photographer for 3 hours this weekend','Someone experienced in Excel to help me create a dashboard under 800','Find a person who knows React and can help me debug my project','I need a designer','website UI designer'].map(x=>`<span class="chip" role="button" tabindex="0" style="cursor:pointer" onclick="$('#q').value=this.textContent;search(this.textContent)">${x}</span>`).join('')}</div>
${Q?res():`<div class="grid"><div class="card"><h3>1 · Describe</h3><span class="mu">No categories. Plain language.</span></div><div class="card"><h3>2 · Understand</h3><span class="mu">AI extracts skills, intent, mode, duration — you can edit.</span></div><div class="card"><h3>3 · Compare & book</h3><span class="mu">Explained matches, 3-step request, in-platform chat.</span></div></div>`}`}
function search(t){if(!t.trim())return;Q=parse(t);sel=[];tab='home';nav();home();document.getElementById('rs').scrollIntoView({behavior:'smooth'})}
function res(){const q=Q;
if(q.s.length===0){return`<h2 id="rs">What do you need?</h2><p class="mu">Your request was a bit vague — one quick question:</p><div class="row">${['Website design','Logo','Mobile app design','Presentation','Photography','Python'].map(x=>`<button class="btn" onclick="search('${x=='Python'?'Teach me Python':x=='Photography'?'photographer':x} ')">${x}</button>`).join('')}</div>`}
const L=P.map(p=>score(p,q)).filter(x=>x.rel>0).sort((a,b)=>b.m-a.m);
return`<div id="rs" class="card"><b>We understood:</b><div class="row" style="margin-top:8px">
<label>Skills<input id="e1" value="${q.s.join(', ')}"></label><label>Purpose<select id="e2"><option ${q.learn?'selected':''}>Learning / mentoring</option><option ${q.learn?'':'selected'}>Short-term task</option></select></label>
<label>Duration<input id="e3" value="${q.dur}"></label><label>Mode<select id="e4"><option ${q.mode=='online'?'selected':''}>online</option><option ${q.mode=='offline'?'selected':''}>offline</option></select></label>
<label>Max ₹/hr<input id="e5" type="number" value="${q.bud||''}" placeholder="any"></label></div><button class="btn p" style="margin-top:10px" onclick="upd()">Update results</button></div>
<div class="row sp"><h2>${L.length} people found</h2><button class="btn p" id="cb" onclick="cmp()" disabled>Compare (0)</button></div>
${L.map(x=>{const p=x.p;return`<div class="card"><div class="row"><div class="av">${p.n[0]}</div><div style="flex:1"><h3>${p.n}</h3><span class="mu">${p.h}</span></div><div style="text-align:right"><b>₹${p.rate}/hr</b><br><span class="mu">${p.r} ${star(p.r)}</span></div></div>
<div style="margin:8px 0">${p.sk.map(s=>`<span class="chip">${s}</span>`).join('')}</div>
<div class="row mu" style="font-size:13px"><span class="ok">✔ ${p.v.map(v=>VL[v]).join(' · ')} verified</span><span>${p.done} completed</span><span>📅 ${p.av}</span><span>${p.mode.join(' / ')}</span></div>
<details style="margin:8px 0"><summary><b>Why this person matches</b> <span class="mu">(${x.m}% fit)</span></summary><ul>${x.why.map(w=>`<li>${w}</li>`).join('')}</ul><div class="bar"><i style="width:${x.m}%"></i></div></details>
<div class="row"><button class="btn" onclick="view(${p.id})">View Profile</button><button class="btn p" onclick="req(${p.id})">Request</button><label class="row mu"><input type="checkbox" style="width:auto" onchange="pick(${p.id},this.checked)"> Compare</label></div></div>`}).join('')}
<p class="mu" style="font-size:13px">Verification shows which checks were completed; it is not a guarantee of quality or safety.</p>`}
function upd(){const s=$('#e1').value.split(',').map(x=>x.trim().toLowerCase()).filter(Boolean);Q={...Q,s,learn:$('#e2').value[0]=='L',dur:$('#e3').value,mode:$('#e4').value,bud:+$('#e5').value||null};home();document.getElementById('rs').scrollIntoView()}
function pick(id,c){c?sel.length<4&&sel.push(id):sel=sel.filter(x=>x!=id);if(c&&!sel.includes(id))event.target.checked=false;$('#cb').disabled=sel.length<2;$('#cb').textContent='Compare ('+sel.length+')'}
function modal(h){$('#mod').innerHTML=`<div class="modal" onclick="if(event.target==this)mc()"><div role="dialog">${h}<p><button class="btn" onclick="mc()">Close</button></p></div></div>`}function mc(){$('#mod').innerHTML=''}
function cmp(){const S=sel.map(i=>score(P.find(p=>p.id==i),Q));const rows=[['Skill match',x=>Math.round(x.rel*100)+'%'],['Experience',x=>x.p.ex+' yrs'],['Price',x=>'₹'+x.p.rate+'/hr'],['Availability',x=>x.p.av],['Reviews',x=>x.p.r+' ('+x.p.rv+')'],['Verification',x=>x.p.v.map(v=>VL[v]).join(', ')],['Portfolio',x=>x.p.v.includes('portfolio')?'Verified':'—'],['Mode',x=>x.p.mode.join(' / ')]];
const best=S.slice().sort((a,b)=>b.m-a.m)[0];
modal(`<h3>Compare</h3><div class="scroll"><table><tr><th></th>${S.map(x=>`<th>${x.p.n}</th>`).join('')}</tr>${rows.map(r=>`<tr><td class="mu">${r[0]}</td>${S.map(x=>`<td>${r[1](x)}</td>`).join('')}</tr>`).join('')}</table></div><p><b>AI summary:</b> ${best.p.n} is the closest overall fit — ${best.why.slice(0,2).join('; ').toLowerCase()}.</p>`)}
function view(id){const p=P.find(x=>x.id==id);modal(`<div class="row"><div class="av">${p.n[0]}</div><div><h3>${p.n}</h3><span class="mu">${p.h} · ${p.loc} (approx.)</span></div></div>
<p>${p.sk.map(s=>`<span class="chip">${s}</span>`).join('')}</p><p><b>About:</b> ${p.ex} years of hands-on experience. ${p.prev}.</p><p><b>Reviews:</b> ${p.r} ${star(p.r)} from ${p.rv} reviews · ${p.done} completed · ${p.resp}% response rate</p>
<p><b>Pricing:</b> ₹${p.rate}/hour or negotiable project rate<br><b>Availability:</b> ${p.av}<br><b>Mode:</b> ${p.mode.join(' / ')}</p><p class="ok">✔ ${p.v.map(v=>VL[v]).join(', ')} verified</p>
<p class="mu">Contact info stays private; message through the platform.</p><div class="row"><button class="btn" onclick="mc();req(${p.id})">Contact</button><button class="btn p" onclick="mc();req(${p.id})">Request Service</button></div><p><a href="#" onclick="rep();return false">Report or block this user</a></p>`)}
function rep(){modal('<h3>Report submitted</h3><p>Our moderation team will review. You can also block this user from messaging you.</p>')}
function req(id){cur=P.find(x=>x.id==id);const q=Q||{dur:'5 hours',bud:null};
modal(`<h3>Request ${cur.n}</h3><p class="mu">3 quick steps: when · scope · budget</p><label>Date & time<input id="r1" value="Saturday, 10 AM"></label><label>Duration (hours)<input id="r2" type="number" value="${parseInt(q.dur)||5}"></label>
<label>Requirement<textarea id="r3" rows="2">${Q?Q.raw:'Help with my project'}</textarea></label><label>Budget ₹<input id="r4" type="number" value="${(parseInt(q.dur)||5)*cur.rate}"></label><p class="mu">AI scope check: ${Q&&Q.learn?'Suggest splitting into 2 sessions — concepts first, then project build.':'Task looks clearly scoped.'}</p>
<button class="btn p" onclick="send()">Send Request</button>`)}
function send(){const h=+$('#r2').value,b=+$('#r4').value;cur.req={t:$('#r1').value,h,b};flow=1;msgs=[['me','Hi! '+$('#r3').value]];mc();tab='chat';nav();chat()}
function chat(){if(!cur){app.innerHTML='<h2>Messages</h2><p class="mu">No conversations yet. Request a person from search results to start one.</p>';return}
const r=cur.req,st=['','Pending — waiting for '+cur.n.split(' ')[0],'Scheduled','Completed','Reviewed'][flow];
app.innerHTML=`<div class="card"><div class="row sp"><div><b>${Q&&Q.learn?'Mentoring':'Task'} with ${cur.n}</b><br><span class="mu">${r.h} h · ₹${r.b} · ${r.t} · Online</span></div><span class="chip ${flow>1?'':'g'}">${st}</span></div></div>
<div class="card" id="log">${msgs.map(m=>`<div class="msg ${m[0]}">${m[1]}</div>`).join('')}</div>
<div class="row">${flow==1?`<button class="btn p" onclick="step(2)">Switch to ${cur.n.split(' ')[0]}: Accept request</button>`:''}${flow==2?`<button class="btn p" onclick="step(3)">Mark session completed</button>`:''}${flow<4?`<input id="cm" placeholder="Type a message…" style="flex:1;min-width:160px"><button class="btn" onclick="say()">Send</button>`:''}</div>
${flow==3?'<div class="card"><b>Task Completed</b> — leave a review<div class="row" id="rv"></div><button class="btn p" style="margin-top:8px" onclick="step(4)">Submit review</button></div>':''}${flow==4?'<div class="card ok"><b>Reviews submitted by both sides.</b> Only completed requests can be reviewed.</div>':''}
<p class="mu" style="font-size:13px">Phone/email sharing is blocked until both agree. Files are scanned before delivery.</p>`;
if(flow==3)$('#rv').innerHTML=['Skill quality','Communication','Reliability','Professionalism','Completion'].map(x=>`<label style="flex:1;min-width:140px">${x}<select><option>5</option><option>4</option><option>3</option></select></label>`).join('')}
function say(){const v=$('#cm').value.trim();if(v){msgs.push(['me',v]);chat()}}
function step(n){flow=n;if(n==2)msgs.push(['',cur.n.split(' ')[0]+': Request accepted! See you '+cur.req.t+'. I\'ll share the agenda here.']);if(n==3)msgs.push(['','Session marked completed.']);chat()}
function prof(){app.innerHTML=`<h2>Create your skill profile</h2><p class="mu">One account works as provider and seeker. Describe yourself — AI drafts the profile.</p><div class="card"><textarea id="pt" rows="3">I have been coding Java for 2 years and know Spring Boot.</textarea><button class="btn p" style="margin-top:8px" onclick="draft()">Generate profile</button></div><div id="pd"></div>`}
function draft(){const q=parse($('#pt').value),y=($('#pt').value.match(/(\d+)\s*year/)||[0,1])[1];const sk=[...new Set(q.s.flatMap(k=>[k,...(REL[k]||[]).slice(0,2)]))];
$('#pd').innerHTML=`<div class="card"><b>AI-generated draft (editable)</b><label>Headline<input value="${(q.s[0]||'Skill')[0].toUpperCase()+(q.s[0]||'skill').slice(1)} developer, ${y} yrs experience"></label><label>Skills (normalized)<input value="${sk.join(', ')}"></label>
<div class="row"><label>Experience (yrs)<input type="number" value="${y}"></label><label>Hourly ₹<input type="number" value="400"></label><label>Availability<input value="Weekends"></label><label>Mode<select><option>Online</option><option>Offline</option><option>Both</option></select></label></div>
<label class="row"><input type="checkbox" checked style="width:auto"> Available for teaching</label><label class="row"><input type="checkbox" checked style="width:auto"> Open to short-term work</label><label class="row"><input type="checkbox" style="width:auto"> Open to negotiation</label>
<p class="mu">Portfolio and certificate uploads can be added later to earn Skill / Portfolio badges. Regulated services (medical, legal, electrical) require credential verification first.</p><button class="btn p" onclick="this.textContent='Published ✔'">Publish</button></div>`}
function dash(){const k=[['My Skills','5'],['My Requests',cur?'1':'0'],['Active Tasks',flow==2?'1':'0'],['Upcoming Sessions',flow==2?'1':'0'],['Unread Messages','2'],['Reviews','4.8 ★'],['Earnings','₹14,200']];
app.innerHTML=`<h2>Dashboard</h2><div class="grid">${k.map(x=>`<div class="card"><span class="mu">${x[0]}</span><h2 style="margin:0">${x[1]}</h2></div>`).join('')}</div><div class="card"><b>Provider mode</b> — Rahul has 1 new request (Spring Boot, 5 h, ₹3,000)<br><button class="btn" onclick="go('chat')">Open</button></div><div class="card"><b>Seeker mode</b> — start a new search to find help.<br><button class="btn" onclick="go('home')">Search</button></div>`}
function admin(){app.innerHTML=`<h2>Admin</h2><div class="grid">${[['Users','1,284'],['Skill listings','3,902'],['Pending verifications','37'],['Reported profiles','6'],['Reported chats','2'],['Requests (7d)','418'],['Suspended','5']].map(x=>`<div class="card"><span class="mu">${x[0]}</span><h2 style="margin:0">${x[1]}</h2></div>`).join('')}</div>
<h3>Moderation queue</h3><div class="card scroll"><table><tr><th>Item</th><th>Flag (auto)</th><th>Action</th></tr>${[['Profile: “Dev Guru”','Possible fake profile — duplicated bio'],['Chat #8821','Phone number shared before acceptance'],['Review on Priya N.','Review-abuse: 5 reviews, same device'],['Profile: “Dr. Sam”','Medical service without credentials'],['User #4410','Spam: 40 requests in 10 minutes']].map(r=>`<tr><td>${r[0]}</td><td class="wn">${r[1]}</td><td><button class="btn" onclick="this.textContent='Done'">Approve</button> <button class="btn" onclick="this.textContent='Suspended'">Suspend</button></td></tr>`).join('')}</table></div>
<p class="mu">Controls: reporting, blocking, dispute flow, rate limits, suspicious-activity checks, credential gating for regulated services.</p>`}
nav();home();
</script></body></html>
